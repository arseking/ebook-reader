<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>纸间 · TXT 阅读器</title>
  </head>
  <body>
    <div id="paper-reader-demo">
      <style>
        /* ========== 基础设定：颜色 ========== */
        #paper-reader-demo {
          --paper-bg: #f7f5ef;          /* 米白：整体背景 */
          --paper-panel: #fffefa;       /* 偏白：顶栏、卡片 */
          --paper-text: #292923;        /* 深灰：正文字色 */
          --paper-muted: #77786f;       /* 中灰：次要说明文字 */
          --paper-line: #e9e6dc;        /* 浅米：分割线 */
          --paper-accent: #55715e;      /* 墨绿：主色调 */
          --paper-accent-soft: #eaf0e9; /* 淡绿：按钮浅背景 */

          width: 100%;                    /* 占满父容器宽度 */

          color: var(--paper-text);       /* 默认字色 = 深灰 */

          font-weight: 400;               /* 字重：正常粗细（400 = 默认）*/
          font-size: 15px;                /* 基础字号 15px（正文会单独改大）*/
          line-height: 1.55;              /* 行高 = 1.55 倍字体大小 */
          font-family: "Segoe UI",        /* ① 英文优先用 Segoe UI */
                       "Microsoft YaHei", /* ② 中文用微软雅黑（Win 自带）*/
                       sans-serif;        /* ③ 都没有就挑一个无衬线字体兜底 */
        }

        /* 让 width 包含边框+内边距，防止布局被撑破 */
        #paper-reader-demo * { box-sizing: border-box; }

        /* ===== 基础设定：阅读器外壳 ===== */
        #paper-reader-demo .app {
          min-height: 630px;            /* 最矮 630px，内容多可继续长高 */
          overflow: hidden;             /* 剪掉超出圆角范围的部分 */
          border: 1px solid #e8e5dc;  /* 1px 浅米色细边 */
          border-radius: 16px;          /* 四角 16px 圆角 */
          background: var(--paper-bg);  /* 背景 = 调色板的米白 */
          box-shadow: 0                 /* ① 水平偏移：不偏移 */
                      18px              /* ② 垂直偏移：向下 18px */
                      55px              /* ③ 模糊半径：55px，越模糊越柔 */
                      rgba(48, 47, 39, .09); /* ④ 颜色：深灰，9% 透明度（极淡） */
        }
        
        #paper-reader-demo .topbar {
          height: 64px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 28px;
          border-bottom: 1px solid var(--paper-line);
          background: var(--paper-panel);
        }
        #paper-reader-demo .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; letter-spacing: .02em; }
        #paper-reader-demo .brand-mark {
          width: 30px; height: 30px; display: grid; place-items: center;
          color: var(--paper-panel); background: var(--paper-accent); border-radius: 9px;
          font-family: Georgia, serif; font-size: 17px;
        }
        #paper-reader-demo .top-meta { color: var(--paper-muted); font-size: 12px; }
        #paper-reader-demo .layout { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 566px; }
        #paper-reader-demo .sidebar {
          display: flex; flex-direction: column; padding: 25px 16px 18px;
          border-right: 1px solid var(--paper-line); background: rgba(255, 254, 250, .58);
        }
        #paper-reader-demo .side-label { padding: 0 12px 11px; color: #96968d; font-size: 11px; letter-spacing: .12em; }
        #paper-reader-demo .side-link {
          width: 100%; min-height: 42px; display: flex; align-items: center; gap: 11px;
          padding: 0 12px; border: 0; border-radius: 9px; background: transparent;
          color: var(--paper-text); text-align: left; font: inherit; font-size: 13px;
        }
        #paper-reader-demo .side-link.active { color: var(--paper-accent); background: var(--paper-accent-soft); font-weight: 500; }
        #paper-reader-demo .side-symbol { width: 17px; color: currentColor; text-align: center; font-size: 16px; }
        #paper-reader-demo .side-bottom { margin-top: auto; padding: 14px 7px 0; border-top: 1px solid var(--paper-line); }
        #paper-reader-demo .side-note { padding: 0 5px 13px; color: var(--paper-muted); font-size: 11px; }
        #paper-reader-demo button { font: inherit; }
        #paper-reader-demo .open-button {
          min-height: 42px; display: flex; align-items: center; justify-content: center; gap: 8px;
          width: 100%; border: 0; border-radius: 9px; background: var(--paper-accent);
          color: #fff; font-size: 13px; font-weight: 500;
        }
        #paper-reader-demo .open-button:hover { filter: brightness(.96); }
        #paper-reader-demo .main { min-width: 0; padding: 38px clamp(24px, 5vw, 66px) 42px; }
        #paper-reader-demo .library-view { max-width: 780px; margin: 0 auto; }
        #paper-reader-demo .eyebrow { margin-bottom: 8px; color: var(--paper-accent); font-size: 11px; letter-spacing: .12em; }
        #paper-reader-demo h1 { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 500; letter-spacing: -.03em; }
        #paper-reader-demo .intro { margin: 9px 0 31px; color: var(--paper-muted); font-size: 13px; }
        #paper-reader-demo .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
        #paper-reader-demo h2 { margin: 0; font-size: 14px; font-weight: 500; }
        #paper-reader-demo .count { color: var(--paper-muted); font-size: 11px; }
        #paper-reader-demo .continue-row {
          display: grid; grid-template-columns: 108px minmax(0, 1fr) auto; align-items: center; gap: 22px;
          padding: 18px; border: 1px solid var(--paper-line); border-radius: 12px; background: var(--paper-panel);
        }
        #paper-reader-demo .cover {
          position: relative; display: flex; min-height: 132px; flex-direction: column; justify-content: space-between;
          overflow: hidden; padding: 14px 12px; border-radius: 7px; color: #f9f7ed;
          background: linear-gradient(145deg, #637e6b 0%, #405b4a 100%);
        }
        #paper-reader-demo .cover::after { content: ""; position: absolute; width: 92px; height: 92px; right: -33px; bottom: -36px; border: 1px solid rgba(255,255,255,.22); border-radius: 50%; box-shadow: 0 0 0 10px rgba(255,255,255,.06), 0 0 0 22px rgba(255,255,255,.04); }
        #paper-reader-demo .cover-kicker { position: relative; z-index: 1; font-family: Georgia, serif; font-size: 9px; letter-spacing: .15em; opacity: .8; }
        #paper-reader-demo .cover-title { position: relative; z-index: 1; font-family: "Songti SC", SimSun, serif; font-size: 17px; line-height: 1.35; }
        #paper-reader-demo .book-info { min-width: 0; }
        #paper-reader-demo .file-tag { color: var(--paper-muted); font-size: 10px; letter-spacing: .08em; }
        #paper-reader-demo .book-title { overflow: hidden; margin: 5px 0 4px; font-size: 19px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
        #paper-reader-demo .book-author { margin: 0 0 17px; color: var(--paper-muted); font-size: 12px; }
        #paper-reader-demo .progress-copy { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 7px; color: var(--paper-muted); font-size: 10px; }
        #paper-reader-demo .progress-copy strong { color: var(--paper-accent); font-weight: 500; }
        #paper-reader-demo .progress-track { height: 3px; overflow: hidden; border-radius: 5px; background: #eeece5; }
        #paper-reader-demo .progress-value { width: 36%; height: 100%; border-radius: inherit; background: var(--paper-accent); }
        #paper-reader-demo .continue-button {
          min-height: 38px; padding: 0 14px; border: 1px solid #d9e2d9; border-radius: 8px;
          background: var(--paper-accent-soft); color: var(--paper-accent); font-size: 12px; font-weight: 500; white-space: nowrap;
        }
        #paper-reader-demo .continue-button:hover { background: #e1e9e0; }
        #paper-reader-demo .recent-head { margin-top: 32px; }
        #paper-reader-demo .recent-list { border-top: 1px solid var(--paper-line); }
        #paper-reader-demo .recent-item { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 69px; border-bottom: 1px solid var(--paper-line); }
        #paper-reader-demo .file-icon { width: 34px; height: 38px; display: grid; place-items: center; border: 1px solid #e5e2d9; border-radius: 5px; background: var(--paper-panel); color: var(--paper-accent); font-size: 9px; font-weight: 500; }
        #paper-reader-demo .recent-title { margin: 0 0 3px; font-size: 13px; font-weight: 500; }
        #paper-reader-demo .recent-sub { margin: 0; color: var(--paper-muted); font-size: 10px; }
        #paper-reader-demo .recent-open { border: 0; background: transparent; color: var(--paper-muted); font-size: 11px; }
        #paper-reader-demo .recent-open:hover { color: var(--paper-accent); }
        #paper-reader-demo .reader-view { display: none; max-width: 740px; margin: 0 auto; }
        #paper-reader-demo .reader-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 17px; border-bottom: 1px solid var(--paper-line); }
        #paper-reader-demo .back-button { border: 0; background: transparent; color: var(--paper-muted); font-size: 12px; }
        #paper-reader-demo .back-button:hover { color: var(--paper-accent); }
        #paper-reader-demo .reader-file { overflow: hidden; color: var(--paper-muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
        #paper-reader-demo .font-controls { display: flex; align-items: center; gap: 5px; padding: 3px; border: 1px solid var(--paper-line); border-radius: 8px; background: var(--paper-panel); }
        #paper-reader-demo .font-controls button { width: 29px; height: 27px; border: 0; border-radius: 5px; background: transparent; color: var(--paper-text); }
        #paper-reader-demo .font-controls button:hover { background: var(--paper-accent-soft); }
        #paper-reader-demo .font-size-label { min-width: 37px; color: var(--paper-muted); text-align: center; font-size: 10px; }
        #paper-reader-demo .reading-column { max-height: 405px; overflow-y: auto; padding: 25px 25px 10px; scrollbar-color: #d5d2c8 transparent; scrollbar-width: thin; }
        #paper-reader-demo .reading-title { margin: 0 0 21px; font-family: "Songti SC", SimSun, serif; font-size: 22px; font-weight: 500; }
        #paper-reader-demo .reading-text { color: #45453e; font-family: "Songti SC", SimSun, "Noto Serif CJK SC", serif; font-size: 17px; line-height: 2.05; white-space: pre-wrap; overflow-wrap: anywhere; }
        #paper-reader-demo .reading-text p { margin: 0 0 1.25em; text-indent: 2em; }
        #paper-reader-demo .reader-footer { display: flex; align-items: center; gap: 15px; padding: 17px 25px 0; color: var(--paper-muted); font-size: 10px; }
        #paper-reader-demo .reader-footer .progress-track { flex: 1; }
        #paper-reader-demo .notice { min-height: 18px; margin-top: 10px; color: var(--paper-muted); font-size: 10px; }
        #paper-reader-demo .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
        #paper-reader-demo button { cursor: pointer; }
        #paper-reader-demo button:focus-visible, #paper-reader-demo input:focus-visible { outline: 2px solid #77947d; outline-offset: 2px; }
        @media (max-width: 700px) {
          #paper-reader-demo .app { min-height: 0; border-radius: 12px; }
          #paper-reader-demo .topbar { height: 56px; padding: 0 16px; }
          #paper-reader-demo .layout { display: block; min-height: 0; }
          #paper-reader-demo .sidebar { display: none; }
          #paper-reader-demo .main { padding: 29px 18px 32px; }
          #paper-reader-demo h1 { font-size: 24px; }
          #paper-reader-demo .continue-row { grid-template-columns: 72px minmax(0, 1fr); gap: 14px; padding: 13px; }
          #paper-reader-demo .cover { min-height: 108px; padding: 11px 9px; }
          #paper-reader-demo .cover-title { font-size: 14px; }
          #paper-reader-demo .book-title { font-size: 16px; }
          #paper-reader-demo .continue-button { grid-column: 2; justify-self: start; }
          #paper-reader-demo .reader-toolbar { flex-wrap: wrap; }
          #paper-reader-demo .reader-file { order: 3; width: 100%; }
          #paper-reader-demo .reading-column { max-height: 430px; padding: 22px 6px 8px; }
          #paper-reader-demo .reader-footer { padding-right: 6px; padding-left: 6px; }
        }
      </style>
      <section class="app" aria-label="纸间 TXT 阅读器">
        <header class="topbar">
          <div class="brand"><span class="brand-mark" aria-hidden="true">纸</span><span>纸间</span></div>
          <div class="top-meta">本地阅读 · 无需联网</div>
        </header>
        <div class="layout">
          <aside class="sidebar" aria-label="主导航">
            <div class="side-label">阅读空间</div>
            <button class="side-link active" type="button" aria-current="page"><span class="side-symbol" aria-hidden="true">◷</span>最近阅读</button>
            <div class="side-bottom">
              <div class="side-note">支持 TXT 文本文件</div>
              <button class="open-button" id="pr-open-file" type="button"><span aria-hidden="true">＋</span>打开 TXT 文件</button>
              <input id="pr-file-input" class="sr-only" type="file" accept=".txt,text/plain" aria-label="选择 TXT 文件">
            </div>
          </aside>
          <main class="main">
            <section class="library-view" id="pr-library">
              <div class="eyebrow">你的阅读空间</div>
              <h1>慢一点，读几页。</h1>
              <p class="intro">书会记住你读到哪里。下次打开，接着读就好。</p>
              <div class="section-head"><h2>接着上次读</h2><span class="count">最近打开</span></div>
              <article class="continue-row">
                <div class="cover" aria-label="《海风之间》封面示意"><span class="cover-kicker">TXT · 随笔</span><span class="cover-title">海风<br>之间</span></div>
                <div class="book-info">
                  <div class="file-tag">TXT 文本</div>
                  <h2 class="book-title">海风之间.txt</h2>
                  <p class="book-author">林知夏 · 上次读到一半</p>
                  <div class="progress-copy"><span>阅读进度</span><strong id="pr-library-progress">36%</strong></div>
                  <div class="progress-track" role="progressbar" aria-label="海风之间阅读进度" aria-valuenow="36" aria-valuemin="0" aria-valuemax="100"><div class="progress-value" id="pr-library-bar"></div></div>
                </div>
                <button class="continue-button" id="pr-continue" type="button">继续阅读 <span aria-hidden="true">→</span></button>
              </article>
              <div class="section-head recent-head"><h2>最近打开</h2><span class="count">2 本</span></div>
              <div class="recent-list">
                <div class="recent-item">
                  <div class="file-icon" aria-hidden="true">TXT</div>
                  <div><p class="recent-title">山城来信.txt</p><p class="recent-sub">读到 12% · 今天</p></div>
                  <button class="recent-open" type="button" data-sample="letter">打开 <span aria-hidden="true">→</span></button>
                </div>
                <div class="recent-item">
                  <div class="file-icon" aria-hidden="true">TXT</div>
                  <div><p class="recent-title">雨停以后.txt</p><p class="recent-sub">读到 68% · 昨天</p></div>
                  <button class="recent-open" type="button" data-sample="rain">打开 <span aria-hidden="true">→</span></button>
                </div>
              </div>
            </section>
            <section class="reader-view" id="pr-reader" aria-label="文本阅读区">
              <div class="reader-toolbar">
                <button class="back-button" id="pr-back" type="button"><span aria-hidden="true">←</span> 返回书架</button>
                <div class="reader-file" id="pr-reader-file">海风之间.txt</div>
                <div class="font-controls" aria-label="字号调整">
                  <button type="button" id="pr-font-down" aria-label="减小字号">A−</button>
                  <span class="font-size-label" id="pr-font-label">17 px</span>
                  <button type="button" id="pr-font-up" aria-label="增大字号">A＋</button>
                </div>
              </div>
              <div class="reading-column" id="pr-reading-column" tabindex="0" aria-label="可滚动阅读正文">
                <h2 class="reading-title" id="pr-reading-title">海风之间</h2>
                <div class="reading-text" id="pr-reading-text"></div>
              </div>
              <div class="reader-footer"><span>阅读进度</span><div class="progress-track" role="progressbar" aria-label="当前阅读进度" aria-valuenow="36" aria-valuemin="0" aria-valuemax="100"><div class="progress-value" id="pr-reader-bar"></div></div><strong id="pr-reader-progress">36%</strong></div>
              <div class="notice" id="pr-notice" aria-live="polite">阅读位置会自动保存</div>
            </section>
          </main>
        </div>
      </section>
      <script>
        (() => {
          const root = document.getElementById("paper-reader-demo");
          const library = root.querySelector("#pr-library");
          const reader = root.querySelector("#pr-reader");
          const input = root.querySelector("#pr-file-input");
          const column = root.querySelector("#pr-reading-column");
          const textNode = root.querySelector("#pr-reading-text");
          const notice = root.querySelector("#pr-notice");
          const sample = [
            "海边的风总是比城里慢一些。它从远处的水面一路走来，经过晒得发白的石阶，最后停在窗边，轻轻掀动桌上的纸页。",
            "我搬来这里的第三个星期，才第一次在清晨出门。街上还没有卖早点的人，只有一只灰猫蹲在门口，像是已经等了很久。",
            "沿着坡道往下走，可以看见海。天色刚亮时，海面是浅浅的灰蓝色，几只船安静地停在远处。没有人说话，连浪声也像隔着一层薄雾。",
            "后来我常常想起那段日子。不是因为发生过什么大事，而是每一天都留着一点空白：一杯温茶，一封没有寄出的信，和傍晚时从窗外经过的风。",
            "朋友问我，住在海边是不是就会变得平静。我说不一定。海有时很吵，天气也会突然转坏。但只要站在岸边，心里那些急着回答的问题，就会暂时安静下来。",
            "那天傍晚，我把最后一只纸箱拆开。里面有几本旧书、一张褪色的车票，还有一封写给多年前自己的信。我没有读完，只把它放回抽屉。",
            "窗外的灯一盏一盏亮起。楼下传来锅铲碰响的声音，海风把晚饭的香气送上来。我合上书，决定明天再继续。"
          ].join("\n\n");
          const alternate = {
            letter: { title: "山城来信", name: "山城来信.txt", content: "亲爱的你：\n\n山城今天下了一场很短的雨。雨停以后，屋檐还在滴水，远处的山被洗成了很淡的青色。\n\n我沿着旧街慢慢往上走，经过那家总是亮着灯的小书店。老板还记得你，说去年秋天你在这里买过一本诗集。\n\n有些地方并没有变。巷口的桂花树仍然长得很高，公交车依旧在拐弯处停得太急。只是我们都比从前多了一点耐心，愿意把路走完，再决定要去哪里。\n\n等下次见面，我再把剩下的故事讲给你听。" },
            rain: { title: "雨停以后", name: "雨停以后.txt", content: "雨停以后，院子里有一种清新的味道。屋檐下的水珠落进青石缝里，发出很轻的声响。\n\n奶奶把窗户推开，说今天适合晒书。我抱着那摞旧书走到廊下，一本一本翻开，让潮湿的空气从纸页间穿过去。\n\n午后阳光出现得很慢，先落在墙角，然后爬上藤椅的扶手。我们谁也没有说话，只听见树上的鸟偶尔叫一声。\n\n傍晚时，云散开了。远处的屋顶还留着雨水，像许多安静的镜子。" }
          };
          let activeKey = "demo:sea";
          let fontSize = 17;
          let userFile = false;

          function savedProgress(key) {
            try { return Math.min(0.95, Math.max(0, Number(localStorage.getItem("paper-reader-progress:" + key)) || 0)); }
            catch { return 0; }
          }
          function saveProgress() {
            const max = column.scrollHeight - column.clientHeight;
            const ratio = max > 0 ? column.scrollTop / max : 0;
            try { localStorage.setItem("paper-reader-progress:" + activeKey, String(ratio)); } catch {}
            updateProgress(ratio);
          }
          function updateProgress(value) {
            const percent = Math.round(value * 100);
            root.querySelector("#pr-reader-progress").textContent = percent + "%";
            root.querySelector("#pr-reader-bar").style.width = percent + "%";
            root.querySelector("#pr-reader-bar").parentElement.setAttribute("aria-valuenow", String(percent));
            if (activeKey === "demo:sea") {
              root.querySelector("#pr-library-progress").textContent = percent + "%";
              root.querySelector("#pr-library-bar").style.width = percent + "%";
              root.querySelector("#pr-library-bar").parentElement.setAttribute("aria-valuenow", String(percent));
            }
          }
          function openReader(title, name, content, key, isUserFile, restore = true) {
            activeKey = key;
            userFile = isUserFile;
            root.querySelector("#pr-reading-title").textContent = title;
            root.querySelector("#pr-reader-file").textContent = name;
            textNode.replaceChildren(...content.split(/\n/).flatMap((line, index, lines) => {
              if (!line) return [];
              const p = document.createElement("p");
              p.textContent = line;
              return [p];
            }));
            library.style.display = "none";
            reader.style.display = "block";
            column.scrollTop = 0;
            requestAnimationFrame(() => {
              const position = restore ? savedProgress(activeKey) : 0;
              const max = column.scrollHeight - column.clientHeight;
              column.scrollTop = max * position;
              updateProgress(position || 0.36);
              if (!position && activeKey === "demo:sea") column.scrollTop = max * 0.36;
              notice.textContent = isUserFile ? "此文件的阅读位置会保存在这台设备" : "阅读位置会自动保存";
            });
          }
          function openSample(type = "sea") {
            if (type === "sea") openReader("海风之间", "海风之间.txt", sample, "demo:sea", false);
            else {
              const item = alternate[type];
              openReader(item.title, item.name, item.content, "demo:" + type, false);
            }
          }
          root.querySelector("#pr-continue").addEventListener("click", () => openSample("sea"));
          root.querySelectorAll("[data-sample]").forEach(button => button.addEventListener("click", () => openSample(button.dataset.sample)));
          root.querySelector("#pr-back").addEventListener("click", () => { saveProgress(); reader.style.display = "none"; library.style.display = "block"; });
          root.querySelector("#pr-open-file").addEventListener("click", () => input.click());
          root.querySelector("#pr-font-down").addEventListener("click", () => {
            fontSize = Math.max(14, fontSize - 1); textNode.style.fontSize = fontSize + "px"; root.querySelector("#pr-font-label").textContent = fontSize + " px"; saveProgress();
          });
          root.querySelector("#pr-font-up").addEventListener("click", () => {
            fontSize = Math.min(24, fontSize + 1); textNode.style.fontSize = fontSize + "px"; root.querySelector("#pr-font-label").textContent = fontSize + " px"; saveProgress();
          });
          column.addEventListener("scroll", saveProgress, { passive: true });
          input.addEventListener("change", async () => {
            const file = input.files && input.files[0];
            if (!file) return;
            try {
              const bytes = await file.arrayBuffer();
              let content;
              try { content = new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
              catch { content = new TextDecoder("gb18030").decode(bytes); }
              const title = file.name.replace(/\.txt$/i, "") || "未命名文本";
              openReader(title, file.name, content, "file:" + file.name + ":" + file.size, true, true);
            } catch {
              notice.textContent = "暂时无法识别该文件编码，请尝试 UTF-8 或 GB18030 编码的 TXT。";
            } finally { input.value = ""; }
          });
          openSample("sea");
          reader.style.display = "none";
          library.style.display = "block";

          const styleChoices = { surface: "warm" };
          const applyStyleChoice = () => {
            const warm = styleChoices.surface === "warm";
            root.style.setProperty("--paper-bg", warm ? "#f7f5ef" : "#f5f6f3");
            root.style.setProperty("--paper-panel", warm ? "#fffefa" : "#ffffff");
          };
          if (globalThis.Tweak) {
            const tweak = new Tweak({ container: root, onChange: applyStyleChoice });
            tweak.addSelect(styleChoices, "surface", { label: "阅读界面纸色", options: [{ label: "暖纸色", value: "warm" }, { label: "清白色", value: "white" }] });
          }
        })();
      </script>
    </div>
  </body>
</html>
